<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        var storedLang = localStorage.getItem('lang');
        if (storedLang) {
            document.documentElement.setAttribute('lang', storedLang);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="position.title">Position — Suivi ISS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="shortcut icon" href="./images/earth.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css/common.css">
    <link rel="stylesheet" href="./styles.css/position.css">
</head>
<body>
    <div class="controls-left">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Passer en mode clair">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button id="lang-toggle" type="button" class="lang-toggle" aria-label="Choisir la langue">FR</button>
    </div>
    <nav class="navbar" id="navbar" aria-label="Navigation principale">
        <ul class="nav-links">
            <li><a href="index.html" data-i18n-aria="nav.home" aria-label="Accueil"><i class="fa-solid fa-house"></i></a></li>
            <li><a href="equipage.html" data-i18n-aria="nav.crew" aria-label="Équipage"><i class="fa-solid fa-users"></i></a></li>
            <li><a href="position.html" class="active" data-i18n-aria="nav.position" aria-label="Position en temps réel"><i
                        class="fa-solid fa-location-crosshairs"></i></a></li>
            <li><a href="live.html" data-i18n-aria="nav.live" aria-label="Live vidéo"><i class="fa-solid fa-video"></i></a></li>
            <li><a href="rovers.html" data-i18n-aria="nav.rovers" aria-label="Rovers"><i class="fa-solid fa-truck-monster"></i></a></li>
        </ul>
    </nav>
    <main>
        <header class="page-header">
            <p class="page-kicker" data-i18n="position.kicker">Position en temps réel</p>
        </header>
       <div class="position-main">
        <div class="data">
            <div id="map"></div>
 
            <div id="iss-data">
                <p class="panel-title">
                    <span class="live-dot" aria-hidden="true"></span>
                    <span data-i18n="position.live">En direct</span>
                </p>
                <p>
                    <span class="data-label" data-i18n="position.altitude">Altitude</span>
                    <span class="data-value"><span id="altitude">--</span> km</span>
                </p>
                <p>
                    <span class="data-label" data-i18n="position.velocity">Vitesse</span>
                    <span class="data-value"><span id="velocity">--</span> km/h</span>
                </p>
                <p>
                    <span class="data-label" data-i18n="position.latitude">Latitude</span>
                    <span class="data-value"><span id="latitude">--</span>°</span>
                </p>
                <p>
                    <span class="data-label" data-i18n="position.longitude">Longitude</span>
                    <span class="data-value"><span id="longitude">--</span>°</span>
                </p>
            </div>
    </main>
    <footer class="site-footer">
        <p data-i18n="footer.update">Mise à jour 09/2026.</p>
    </footer>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
</body>
</html>
